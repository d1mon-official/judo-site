<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LH93M6R3T5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-LH93M6R3T5');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Meet the Judo Center New York athletes who train, compete, and represent our team on the mat.">
    <link rel="canonical" href="https://judocenternewyork.com/athletes">
    <title>Athletes | Judo Center</title>
    <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png"
    href="https://i.postimg.cc/jq4s9dLf/091.jpg">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="athletes-page">

    <header class="main-header">
        <div class="container header-container">
            <a href="/" class="logo" aria-label="Judo Center New York home">
                <img src="https://i.postimg.cc/8cz2HLvT/photo_2025_12_23_11_22_05_removebg_preview.png" class="logo-img">
            </a>
            <div class="header-right">
                <div class="lang-selector">
                    <button class="lang-node" onclick="changeLang('uk', this)">UA</button>
                    <button class="lang-node active" onclick="changeLang('en', this)">EN</button>
                    <button class="lang-node" onclick="changeLang('ru', this)">RU</button>
                </div>
                <a href="/#contact" class="btn-header-join" data-key="btn_join">Join Us</a>
            </div>
        </div>
    </header>

    <section class="athletes-section">
        <div class="container">
            <h2 class="section-title" style="margin-top: 120px;" data-key="athletes_title">Our Team</h2>
<div class="cards" id="athletesCards">
    <div class="card" onclick="window.location.href='/profile?id=dmytrii_malishevskyi'" data-aos="fade-up">
        <img src="https://i.postimg.cc/rmqXkhRJ/2026-02-10-19-31-45.jpg" alt="Dmytrii">
        <div class="card-info">
            <h3>Dmytrii</h3>
            <p>Green Belt</p>
            <button class="view-btn">View Profile</button>
        </div>
    </div>

    <div class="card" onclick="window.location.href='/profile?id=oleg'" data-aos="fade-up" data-aos-delay="100">
        <img src="https://i.postimg.cc/2jb51xt6/43214-jpg.webp" alt="Oleg">
        <div class="card-info">
            <h3>Oleg</h3>
            <p>Brown Belt</p>
            <button class="view-btn">View Profile</button>
        </div>
    </div>

    <div class="card" onclick="window.location.href='/profile?id=marta'" data-aos="fade-up" data-aos-delay="200">
        <img src="https://i.postimg.cc/rwL2F1Bn/14-jpg.webp" alt="Marta">
        <div class="card-info">
            <h3>Marta</h3>
            <p>Blue Belt</p>
            <button class="view-btn">View Profile</button>
        </div>
    </div>
</div>
        </div>
    </section>

    <div id="profile" class="profile-overlay">
        <div class="profile-card">
            <button class="close-x" onclick="closeProfile()">&times;</button>
            <div class="profile-content">
                <div class="profile-img-side">
                    <img id="p_image" src="" alt="Athlete">
                </div>
                <div class="profile-info-side">
                    <h2 id="p_name"></h2>
                    <div class="stats-grid">
                        <p><strong>Birth Year:</strong> <span id="p_birth"></span></p>
                        <p><strong>In Club Since:</strong> <span id="p_year"></span></p>
                        <p><strong>Belt:</strong> <span id="p_belt"></span></p>
                    </div>
                    <div class="bio-text">
                        <h3>Biography</h3>
                        <p id="p_bio"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="seo.js"></script>
    <script src="script.js"></script>

    <script>
        if (typeof AOS !== "undefined") {
            AOS.init();
        }
        renderAthleteCards();
    </script>

</body>
</html>
